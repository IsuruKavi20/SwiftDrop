# Isuru's test report evidence. Lives ONLY on the branch "report/isuru-tests" in Isuru's fork: it is never part
# of a pull request to the team repo. Runs only Isuru's tests (identity, security, error format, AI rate limits,
# outbox and tracking links, frontend auth helpers) and writes the results and coverage into the run summary,
# so the run id, commit and times can go into the test report's evidence table.
name: My test report (Isuru)

on:
  push:
    branches: ["report/isuru-tests"]
  workflow_dispatch:

permissions: {}

jobs:
  backend:
    name: My backend tests + coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # JaCoCo is called by its full name here, so the team's pom.xml stays unchanged
      - name: Run my tests with coverage
        run: |
          J=org.jacoco:jacoco-maven-plugin:0.8.13
          TESTS='com.swiftdrop.backend.identity.**.*Test,com.swiftdrop.backend.security.*Test,com.swiftdrop.backend.shared.error.*Test,com.swiftdrop.backend.ai.security.*Test,com.swiftdrop.backend.ai.AiAssistantApiTest,com.swiftdrop.backend.ModularityTest,com.swiftdrop.backend.notification.service.CustomerStatusListenerTest,com.swiftdrop.backend.notification.service.NotificationServicePagingTest,com.swiftdrop.backend.notification.service.OutboxTest,com.swiftdrop.backend.notification.service.TrackingLinksTest'
          ./mvnw -B $J:prepare-agent test $J:report -Dtest="$TESTS" -Dsurefire.failIfNoSpecifiedTests=false
      - name: Results and coverage of my code (into the run summary)
        if: always()
        run: python3 ../.github/workflows/my-test-report.py >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: My frontend tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Auth helper tests
        run: |
          echo '## My frontend tests (auth helpers)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx --yes tsx@4.23.15 --test src/features/auth/lib/__tests__/authHelpers.test.ts 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
