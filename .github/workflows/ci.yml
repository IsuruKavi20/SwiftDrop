# Builds and tests every pull request and every push to main, so a broken PR is caught before it reaches main.
# Actions are pinned to exact commits; permissions are read-only.
name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # All tests, including the Flyway migrations on the test database
      - run: ./mvnw -B verify

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci
      - run: npm run lint
      # Type check + production build
      - run: npm run build
