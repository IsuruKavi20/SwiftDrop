# RabbitMQ inside the cluster ($0 extra). Reachable only from inside; the management UI is opened with
# "kubectl port-forward" when needed, never on the internet.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: swiftdrop-rabbitmq
  labels:
    {{- include "swiftdrop.labels" . | nindent 4 }}
spec:
  serviceName: swiftdrop-rabbitmq
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: rabbitmq }
  template:
    metadata:
      labels:
        {{- include "swiftdrop.labels" . | nindent 8 }}
        app.kubernetes.io/name: rabbitmq
    spec:
      automountServiceAccountToken: false
      # The data folder (k3s local disk) can start out owned by root, and RabbitMQ (user 999) then can't read its
      # own .erlang.cookie ("eacces") and crashes on the first start (seen 14 Nov). Give the folder to user 999
      # before RabbitMQ starts; same image, so no extra download.
      initContainers:
        - name: fix-data-owner
          image: {{ .Values.rabbitmq.image }}
          command: ["sh", "-c", "chown -R 999:999 /var/lib/rabbitmq"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - { name: data, mountPath: /var/lib/rabbitmq }
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image }}
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: management, containerPort: 15672 }
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: { secretKeyRef: { name: swiftdrop-secrets, key: RABBITMQ_USERNAME } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: swiftdrop-secrets, key: RABBITMQ_PASSWORD } }
          resources:
            {{- toYaml .Values.rabbitmq.resources | nindent 12 }}
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "status"] }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
          volumeMounts:
            - { name: data, mountPath: /var/lib/rabbitmq }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: {{ .Values.rabbitmq.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: swiftdrop-rabbitmq
  labels:
    {{- include "swiftdrop.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: amqp }
