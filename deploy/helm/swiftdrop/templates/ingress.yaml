# Traefik (built into k3s) receives HTTPS for api.getswiftdrop.me; cert-manager gets the Let's Encrypt certificate.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: no-referrer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: swiftdrop-api
  labels:
    {{- include "swiftdrop.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [{{ .Values.ingress.host }}]
      secretName: api-tls
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: swiftdrop-backend, port: { name: http } }
