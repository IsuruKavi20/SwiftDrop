spring.application.name=backend

# Users log in at the SwiftDrop auth service; this API only checks the access tokens it issues.
# Override with environment variables, e.g. SWIFTDROP_AUTH_ISSUER for a local auth service.
swiftdrop.auth.issuer=${SWIFTDROP_AUTH_ISSUER:https://auth.getswiftdrop.me}
swiftdrop.auth.audience=swiftdrop-api
# Browser apps allowed to call this API (comma-separated). The React dev server:
swiftdrop.auth.allowed-origins=${SWIFTDROP_ALLOWED_ORIGINS:http://localhost:5173}

# PostgreSQL database SwiftDrop_db (the name is case-sensitive).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/SwiftDrop_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
# The shared dev database (db.t4g.micro) allows only about 80 connections in total. Each running backend keeps its
# pool open, so 3 per laptop lets the whole team work at once (10 laptops = 30). The server sets its own size.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
# Your own username/password go in application-local.properties next to this file (git-ignored, never committed).
spring.config.import=optional:classpath:application-local.properties
# Flyway creates the tables from src/main/resources/db/migration; Hibernate only checks the entities match them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Background jobs (identity refresh, event polling, cleanup) must not wait for each other
spring.task.scheduling.pool.size=3

# RabbitMQ configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_LISTENER_AUTO_STARTUP:false}

# Mock mail configuration (or local SMTP like MailHog)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false


# Every log line of a request shows its requestId (the same id as in error answers and the X-Request-Id header)
logging.pattern.level=%5p [%X{requestId:-}]

# Health checks (Kubernetes probes). On a separate port that is never exposed to the internet; only "health" is on.
# Liveness = the app itself; readiness = the app + the database (no traffic until the DB answers).
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
# Graceful stop: finish running requests (max 20 s) before the pod is replaced
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Event outbox (Spring Modulith): finished events are deleted, open ones are sent again at start-up and every minute
spring.modulith.events.completion-mode=delete
spring.modulith.events.republish-outstanding-events-on-restart=true
