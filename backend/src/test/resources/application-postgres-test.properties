# =====================================================================
# Dedicated Isolated PostgreSQL Test Profile
# Usage: ./mvnw test -Dspring.profiles.active=postgres-test
# =====================================================================

spring.datasource.url=${TEST_POSTGRES_URL:jdbc:postgresql://localhost:5432/swiftdrop_test}
spring.datasource.username=${TEST_POSTGRES_USER:postgres}
spring.datasource.password=${TEST_POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.rabbitmq.listener.simple.auto-startup=false
spring.mail.host=localhost
spring.mail.port=1025
swiftdrop.maps.google.api-key=
